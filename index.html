// Almacenamiento persistente (equivalente a window.storage) usando localStorage
if (!window.storage) {
  window.storage = {
    get: async (k) => { try { const v = localStorage.getItem(k); return v === null ? null : { key: k, value: v }; } catch (e) { return null; } },
    set: async (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} return { key: k, value: v }; }
  };
}

/* ─────────────── UTILS ─────────────── */
function riderAge(rider) {
  if (rider.birthYear) return new Date().getFullYear() - parseInt(rider.birthYear);
  return rider.age ? parseInt(rider.age) : null;
}

function avgScore(scores) {
  if (!scores) return 0;
  return SKILLS.reduce((a,s) => a+(scores[s.id]??0), 0) / SKILLS.length;
}
function scoreColor(v) {
  if (v >= 8) return "#00E676";
  if (v >= 6) return "#FFD600";
  if (v >= 4) return "#FF6D00";
  return "#FF1744";
}
function riderPoints(rider) {
  const achPts = ACHIEVEMENTS.filter(a => a.check(rider)).reduce((s,a) => s+a.pts, 0);
  const compPts = (rider.compResults||[]).reduce((s,c) => s+c.pts, 0);
  const bonusPts = (rider.bonusPoints||[]).reduce((s,b) => s+b.pts, 0);
  return achPts + compPts + bonusPts;
}
function riderLevel(pts) {
  if (pts >= 1500) return { name:"ELITE", color:"#FFD700", next:null };
  if (pts >= 900)  return { name:"EXPERT", color:"#CC0000", next:1500 };
  if (pts >= 450)  return { name:"AVANZADO", color:"#FF6600", next:900 };
  if (pts >= 150)  return { name:"INTERMEDIO", color:"#FFAA00", next:450 };
  return { name:"NOVATO", color:"#888", next:150 };
}

function useStorage(key, def) {
  const [val, setVal] = useState(def);
  const [ready, setReady] = useState(false);
  useEffect(() => {
    (async () => {
      try { const r = await window.storage.get(key); if (r?.value) setVal(JSON.parse(r.value)); } catch {}
      setReady(true);
    })();
  }, []);
  const save = useCallback(async (v) => {
    setVal(v);
    try { await window.storage.set(key, JSON.stringify(v)); } catch {};
  }, []);
  return [val, save, ready];
}

  return (

      <text x={40} y={38} textAnchor="middle" dominantBaseline="middle" fill="#fff" fontSize={17} fontWeight={900} fontFamily="'Barlow Condensed',sans-serif">{value.toFixed(1)}</text>
      <text x={40} y={54} textAnchor="middle" dominantBaseline="middle" fill={col} fontSize={8} fontFamily="'Barlow',sans-serif">MEDIA</text>

function Bar({ value, color, label }) {
  const [w, setW] = useState(0);
  useEffect(() => { const t=setTimeout(()=>setW(value*10),150); return ()=>clearTimeout(t); }, [value]);
  return (
    <div style={{marginBottom:10}}>
      <div style={{display:"flex",justifyContent:"space-between",marginBottom:5}}>
        <span style={{fontSize:12,color:"rgba(255,255,255,0.6)"}}>{label}</span>
        <span style={{fontSize:12,fontWeight:700,color:color||scoreColor(value)}}>{value}</span>

        <div style={{height:"100%",width:`${w}%`,background:color||scoreColor(value),borderRadius:4,transition:"width 0.9s ease"}}/>

  );
}

/* ─────────────── PROGRESS CHART ─────────────── */
function ProgressChart({ rider, color }) {
  if (!rider.sessions?.length) return <div style={{textAlign:"center",padding:"40px",color:"rgba(255,255,255,0.3)"}}>Sin sesiones para mostrar la progresión</div>;
  const data = rider.sessions.map((s,i) => ({
    name:`S${i+1}`,
    Media: parseFloat(avgScore(s.scores).toFixed(2)),
    Curvas: s.scores.curvas??0,
    Descenso: s.scores.descenso??0,
    Saltos: s.scores.saltos??0,
  }));
  return (
    <div style={{background:"rgba(0,0,0,0.4)",borderRadius:14,padding:"24px",border:"1px solid rgba(255,255,255,0.07)"}}>
      <div style={{fontSize:12,color:"rgba(255,255,255,0.4)",textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:16}}>Progresión por sesiones</div>
      <ResponsiveContainer width="100%" height={200}>
        <LineChart data={data} margin={{top:5,right:10,bottom:0,left:-20}}>
          <CartesianGrid strokeDasharray="3 3" stroke="rgba(255,255,255,0.04)"/>
          <XAxis dataKey="name" stroke="rgba(255,255,255,0.2)" fontSize={11} tick={{fill:"rgba(255,255,255,0.4)"}}/>
          <YAxis domain={[0,10]} stroke="rgba(255,255,255,0.2)" fontSize={11} tick={{fill:"rgba(255,255,255,0.4)"}}/>
          <Tooltip contentStyle={{background:"#1A0000",border:`1px solid ${color}`,borderRadius:8,fontSize:12}} labelStyle={{color:"#fff"}} itemStyle={{color:"rgba(255,255,255,0.7)"}}/>
          <Line type="monotone" dataKey="Media" stroke={color} strokeWidth={3} dot={{fill:color,r:5}} activeDot={{r:7}}/>
          <Line type="monotone" dataKey="Curvas" stroke="#FF9900" strokeWidth={1.5} dot={false} strokeDasharray="4 2"/>
          <Line type="monotone" dataKey="Descenso" stroke="#00C8FF" strokeWidth={1.5} dot={false} strokeDasharray="4 2"/>
          <Line type="monotone" dataKey="Saltos" stroke="#00E676" strokeWidth={1.5} dot={false} strokeDasharray="4 2"/>
        </LineChart>
      </ResponsiveContainer>
      <div style={{display:"flex",gap:16,justifyContent:"center",marginTop:12,flexWrap:"wrap"}}>
        {[["Media",color],["Curvas","#FF9900"],["Descenso","#00C8FF"],["Saltos","#00E676"]].map(([k,c])=>(
          <div key={k} style={{display:"flex",alignItems:"center",gap:6}}>
            <div style={{width:16,height:2,background:c,borderRadius:2}}/>
            <span style={{fontSize:11,color:"rgba(255,255,255,0.5)"}}>{k}</span>
          </div>
        ))}
      </div>
    </div>
  );
}

/* ─────────────── RADAR SVG ─────────────── */
function RadarSVG({ scores, color, size=200 }) {
  const cx=size/2,cy=size/2,r=size*0.35,n=SKILLS.length;
  const angle=i=>(Math.PI*2*i/n)-Math.PI/2;
  const pt=(i,f)=>({x:cx+Math.cos(angle(i))*r*f,y:cy+Math.sin(angle(i))*r*f});
  const grid=f=>SKILLS.map((_,i)=>pt(i,f)).map(p=>`${p.x},${p.y}`).join(" ");
  const poly=SKILLS.map((s,i)=>pt(i,(scores?.[s.id]??0)/10)).map(p=>`${p.x},${p.y}`).join(" ");
  return (
    <svg width={size} height={size} viewBox={`0 0 ${size} ${size}`}>
      {[.25,.5,.75,1].map(f=><polygon key={f} points={grid(f)} fill="none" stroke="rgba(255,255,255,0.08)" strokeWidth={1}/>)}
      {SKILLS.map((_,i)=>{const a=pt(i,1);return<line key={i} x1={cx} y1={cy} x2={a.x} y2={a.y} stroke="rgba(255,255,255,0.08)" strokeWidth={1}/>;} )}
      <polygon points={poly} fill={`${color}28`} stroke={color} strokeWidth={2.5}/>
      {SKILLS.map((s,i)=>{const a=pt(i,(scores?.[s.id]??0)/10);return<circle key={i} cx={a.x} cy={a.y} r={4} fill={color}/>;} )}
      {SKILLS.map((s,i)=>{const l=pt(i,1.24);return<text key={i} x={l.x} y={l.y} textAnchor="middle" dominantBaseline="middle" fontSize={9} fill="rgba(255,255,255,0.45)" fontFamily="'Barlow',sans-serif">{s.icon}</text>;} )}
    </svg>
  );
}

/* ─────────────── ADMIN SHEET ─────────────── */
function AdminSheet({ riders, onSave, onClose, authed, onAuth }) {
  const [pass, setPass] = useState(""); const [err, setErr] = useState("");
  const [adminTab, setAdminTab] = useState(0); const [editingId, setEditingId] = useState(null);
  const [editName, setEditName] = useState(""); const [editAge, setEditAge] = useState("");
  const [editScores, setEditScores] = useState({}); const [editNote, setEditNote] = useState("");
  const [editObjs, setEditObjs] = useState({}); // {raceId: {pts, objs:[]}}
  const [newName, setNewName] = useState(""); const [newAge, setNewAge] = useState(""); const [newGroup, setNewGroup] = useState("adultos"); const [newBirthYear, setNewBirthYear] = useState("");
  const [saved, setSaved] = useState(false); const [scoreTab, setScoreTab] = useState("edit"); // "edit" | "new"
  const [bonusRider, setBonusRider] = useState(""); const [bonusPts, setBonusPts] = useState(""); const [bonusReason, setBonusReason] = useState(""); const [bonusSaved, setBonusSaved] = useState(false);

  const handleAuth=()=>{ if(pass===ADMIN_PASS){onAuth();setErr("");}else setErr("Contraseña incorrecta"); };

  const openEdit=r=>{
    setEditingId(r.id);setEditName(r.name);setEditAge(r.age?.toString()||"");
    const sc=r.sessions?.slice(-1)[0]?.scores??{},init={};
    SKILLS.forEach(sk=>{init[sk.id]=sc[sk.id]??5;});
    setEditScores(init);setEditNote(r.sessions?.slice(-1)[0]?.note||"");
    const objs={};
    SEASON_RACES.forEach(race=>{ const cr=r.compResults?.find(c=>c.raceId===race.id); objs[race.id]={pts:cr?.pts??0,objs:cr?.objs??[]}; });
    setEditObjs(objs);setScoreTab("edit");
  };

  const saveEdit=()=>{
    const updated=riders.map(r=>{
      if(r.id!==editingId)return r;
      let sessions=r.sessions||[];
      if(scoreTab==="new"){
        sessions=[...sessions,{id:Date.now().toString(),date:new Date().toLocaleDateString("es-ES"),scores:{...editScores},note:editNote}];
      } else if(sessions.length){
        sessions=[...sessions.slice(0,-1),{...sessions.slice(-1)[0],scores:{...editScores},note:editNote}];
      } else {
        sessions=[{id:Date.now().toString(),date:new Date().toLocaleDateString("es-ES"),scores:{...editScores},note:editNote}];
      }
      const compResults=SEASON_RACES.filter(race=>editObjs[race.id]?.pts>0).map(race=>({raceId:race.id,pts:editObjs[race.id].pts,objs:editObjs[race.id].objs}));
      return{...r,name:editName,age:editAge||r.age,sessions,compResults};
    });
    onSave(updated);flash();setEditingId(null);
  };

  const deleteRider=id=>{onSave(riders.filter(r=>r.id!==id));setEditingId(null);};
  const addRider=()=>{if(!newName.trim())return;const age=newBirthYear?(new Date().getFullYear()-parseInt(newBirthYear)).toString():newAge;onSave([...riders,{id:Date.now().toString(),name:newName.trim(),age,birthYear:newBirthYear||null,groupId:newGroup,sessions:[],compResults:[]}]);setNewName("");setNewAge("");setNewBirthYear("");flash();};
  const flash=()=>{setSaved(true);setTimeout(()=>setSaved(false),2200);};

  const addBonus=()=>{
    if(!bonusRider||!bonusPts||parseInt(bonusPts)===0)return;
    const entry={id:Date.now().toString(),pts:parseInt(bonusPts),reason:bonusReason.trim()||"Bonus del entrenador",date:new Date().toLocaleDateString("es-ES")};
    onSave(riders.map(r=>r.id===bonusRider?{...r,bonusPoints:[...(r.bonusPoints||[]),entry]}:r));
    setBonusPts("");setBonusReason("");setBonusSaved(true);setTimeout(()=>setBonusSaved(false),2200);
  };

  const removeBonus=(riderId,bonusId)=>{
    onSave(riders.map(r=>r.id===riderId?{...r,bonusPoints:(r.bonusPoints||[]).filter(b=>b.id!==bonusId)}:r));
  };
  const avgVal=Object.keys(editScores).length?Object.values(editScores).reduce((a,b)=>a+b,0)/SKILLS.length:0;

  const toggleObj=(raceId,obj)=>{
    setEditObjs(prev=>{const cur=prev[raceId].objs||[];return{...prev,[raceId]:{...prev[raceId],objs:cur.includes(obj)?cur.filter(o=>o!==obj):[...cur,obj]}};});
  };

  return (
    <div style={{position:"fixed",inset:0,zIndex:300}}>
      <div style={{position:"absolute",inset:0,background:"rgba(0,0,0,0.92)",backdropFilter:"blur(6px)"}} onClick={onClose}/>
      <div style={{position:"absolute",bottom:0,left:0,right:0,background:"linear-gradient(180deg,#1A0000 0%,#0F0000 100%)",borderRadius:"20px 20px 0 0",maxHeight:"88vh",overflowY:"auto",animation:"sheetUp 0.35s cubic-bezier(.4,0,.2,1)",border:"1px solid rgba(204,0,0,0.2)",borderBottom:"none"}} onClick={e=>e.stopPropagation()}>
        <div style={{display:"flex",alignItems:"center",justifyContent:"space-between",padding:"14px 20px 0",position:"sticky",top:0,background:"linear-gradient(180deg,#1A0000 0%,transparent 100%)",zIndex:10}}>
          <div style={{width:40,height:4,background:"rgba(204,0,0,0.4)",borderRadius:2,margin:"0 auto"}}/>
          <button onClick={onClose} style={{background:"rgba(255,255,255,0.07)",border:"1px solid rgba(255,255,255,0.12)",borderRadius:8,padding:"5px 14px",color:"rgba(255,255,255,0.5)",fontSize:12,fontWeight:700,cursor:"pointer",flexShrink:0}}>Salir ✕</button>
        </div>

        {!authed?(
          <div style={{padding:"28px 28px 36px"}}>
            <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:30,fontWeight:900,textTransform:"uppercase",marginBottom:4}}>Panel Admin</div>
            <div style={{fontSize:13,color:"rgba(255,255,255,0.3)",marginBottom:24}}>Acceso exclusivo para entrenadores</div>
            <input type="password" value={pass} onChange={e=>setPass(e.target.value)} placeholder="Contraseña..." onKeyDown={e=>e.key==="Enter"&&handleAuth()} style={{marginBottom:10}}/>
            {err&&<div style={{fontSize:12,color:"#FF1744",marginBottom:12}}>{err}</div>}
            <button onClick={handleAuth} style={{width:"100%",padding:"13px",background:"linear-gradient(90deg,#CC0000,#990000)",border:"none",borderRadius:8,color:"#fff",fontSize:15,fontWeight:800,letterSpacing:"0.05em",textTransform:"uppercase"}}>Acceder</button>
          </div>
        ):editingId?(
          <div style={{padding:"22px 24px 40px"}}>
            <button onClick={()=>setEditingId(null)} style={{background:"transparent",border:"none",color:RED,fontSize:13,fontWeight:700,padding:"0 0 16px",display:"flex",alignItems:"center",gap:6}}>← Volver</button>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:20}}>
              <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:24,fontWeight:900}}>Editar Rider</div>
              <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:32,fontWeight:900,color:scoreColor(avgVal)}}>{avgVal.toFixed(1)}</div>
            </div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,marginBottom:20}}>
              <div><div style={{fontSize:10,color:"rgba(255,255,255,0.35)",textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:5}}>Nombre</div><input value={editName} onChange={e=>setEditName(e.target.value)}/></div>
              <div><div style={{fontSize:10,color:"rgba(255,255,255,0.35)",textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:5}}>Edad</div><input value={editAge} onChange={e=>setEditAge(e.target.value)} placeholder="Edad"/></div>
            </div>
            <div style={{display:"flex",background:"rgba(0,0,0,0.4)",borderRadius:10,padding:4,marginBottom:20}}>
              {[["edit","Editar última sesión"],["new","Nueva sesión"]].map(([k,l])=>(
                <button key={k} onClick={()=>setScoreTab(k)} style={{flex:1,padding:"8px",borderRadius:7,border:"none",background:scoreTab===k?RED:"transparent",color:scoreTab===k?"#fff":"rgba(255,255,255,0.4)",fontSize:12,fontWeight:700,transition:"all 0.2s"}}>{l}</button>
              ))}
            </div>
            <div style={{fontSize:11,color:RED,textTransform:"uppercase",letterSpacing:"0.15em",marginBottom:14}}>Puntuaciones</div>
            <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0 20px"}}>
              {SKILLS.map(sk=>(
                <div key={sk.id} style={{marginBottom:16}}>
                  <div style={{display:"flex",justifyContent:"space-between",marginBottom:4}}>
                    <span style={{fontSize:12,fontWeight:600}}>{sk.icon} {sk.label}</span>
                    <span style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:20,fontWeight:900,color:scoreColor(editScores[sk.id]??5)}}>{editScores[sk.id]??5}</span>
                  </div>
                  <input type="range" min={1} max={10} step={1} value={editScores[sk.id]??5} style={{width:"100%",accentColor:RED,padding:0,border:"none",background:"transparent",height:20}} onChange={e=>setEditScores(p=>({...p,[sk.id]:parseInt(e.target.value)}))}/>
                </div>
              ))}
            </div>
            <div style={{marginBottom:20}}><div style={{fontSize:10,color:"rgba(255,255,255,0.35)",textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:5}}>Nota del entrenador</div><textarea value={editNote} onChange={e=>setEditNote(e.target.value)} style={{minHeight:54,resize:"vertical"}} placeholder="Observaciones..."/></div>

            <div style={{fontSize:11,color:"#00C8FF",textTransform:"uppercase",letterSpacing:"0.15em",marginBottom:14}}>Resultados de Competición</div>
            {SEASON_RACES.map(race=>(
              <div key={race.id} style={{background:"rgba(0,0,0,0.3)",borderRadius:10,padding:"12px 14px",marginBottom:8,border:"1px solid rgba(255,255,255,0.05)"}}>
                <div style={{fontSize:13,fontWeight:700,marginBottom:8}}>{race.icon} {race.name}</div>
                <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:8}}>
                  <span style={{fontSize:11,color:"rgba(255,255,255,0.4)"}}>Puntos:</span>
                  <input type="number" min={0} max={race.points} value={editObjs[race.id]?.pts||0} onChange={e=>setEditObjs(p=>({...p,[race.id]:{...p[race.id],pts:parseInt(e.target.value)||0}}))} style={{width:80}}/>
                  <span style={{fontSize:10,color:"rgba(255,255,255,0.3)"}}>/ {race.points} máx</span>
                </div>
                <div style={{display:"flex",gap:6,flexWrap:"wrap"}}>
                  {race.objectives.map(obj=>{
                    const checked=editObjs[race.id]?.objs?.includes(obj);
                    return <button key={obj} onClick={()=>toggleObj(race.id,obj)} style={{fontSize:10,padding:"4px 10px",borderRadius:10,border:`1px solid ${checked?"#00E676":"rgba(255,255,255,0.1)"}`,background:checked?"rgba(0,230,118,0.15)":"transparent",color:checked?"#00E676":"rgba(255,255,255,0.4)",fontWeight:600}}>{checked?"✓ ":""}{obj}</button>;
                  })}
                </div>
              </div>
            ))}

            <div style={{display:"flex",gap:10,marginTop:8}}>
              <button onClick={saveEdit} style={{flex:2,padding:"13px",background:saved?"#00A857":"linear-gradient(90deg,#CC0000,#990000)",border:"none",borderRadius:8,color:"#fff",fontSize:14,fontWeight:800,textTransform:"uppercase",transition:"background 0.3s"}}>{saved?"✓ Guardado":"Guardar Cambios"}</button>
              <button onClick={()=>deleteRider(editingId)} style={{flex:1,padding:"13px",background:"rgba(255,23,68,0.1)",border:"1px solid #FF1744",borderRadius:8,color:"#FF1744",fontSize:12,fontWeight:700}}>Eliminar</button>
            </div>
          </div>
        ):(
          <div style={{padding:"22px 24px 40px"}}>
            <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:18}}>
              <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:26,fontWeight:900}}>Panel Admin</div>
            </div>
            <div style={{display:"flex",background:"rgba(0,0,0,0.4)",borderRadius:10,padding:4,marginBottom:20}}>
              {["Editar Riders","Puntos Extra","Añadir Rider"].map((t,i)=>(
                <button key={i} onClick={()=>setAdminTab(i)} style={{flex:1,padding:"8px",borderRadius:7,border:"none",background:adminTab===i?RED:"transparent",color:adminTab===i?"#fff":"rgba(255,255,255,0.4)",fontSize:12,fontWeight:700,transition:"all 0.2s"}}>{t}</button>
              ))}
            </div>
            {adminTab===0&&GROUPS.map(g=>{
              const gr=riders.filter(r=>r.groupId===g.id);
              if(!gr.length)return null;
              return (
                <div key={g.id} style={{marginBottom:18}}>
                  <div style={{fontSize:11,color:g.color,fontWeight:700,textTransform:"uppercase",letterSpacing:"0.14em",marginBottom:8,display:"flex",alignItems:"center",gap:6}}><div style={{width:8,height:8,borderRadius:"50%",background:g.color}}/>{g.name}</div>
                  {gr.map(rider=>{
                    const s=rider.sessions?.slice(-1)[0]?.scores,a=s?avgScore(s):null,pts=riderPoints(rider),lv=riderLevel(pts);
                    return (
                      <div key={rider.id} onClick={()=>openEdit(rider)}
                        style={{display:"flex",alignItems:"center",gap:12,background:"rgba(0,0,0,0.35)",borderRadius:10,padding:"12px 14px",marginBottom:6,cursor:"pointer",border:`1px solid ${g.color}12`,transition:"background 0.15s"}}
                        onMouseEnter={e=>e.currentTarget.style.background="rgba(204,0,0,0.1)"}
                        onMouseLeave={e=>e.currentTarget.style.background="rgba(0,0,0,0.35)"}>
                        <div style={{width:36,height:36,borderRadius:"50%",background:`${g.color}20`,border:`1.5px solid ${g.color}40`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:14,fontWeight:900,color:g.color,fontFamily:"'Barlow Condensed',sans-serif",flexShrink:0}}>{rider.name[0]}</div>
                        <div style={{flex:1}}>
                          <div style={{fontSize:14,fontWeight:600}}>{rider.name}</div>
                          <div style={{display:"flex",gap:6,marginTop:2}}>
                            <span style={{fontSize:10,color:lv.color,fontWeight:700}}>{lv.name}</span>
                            <span style={{fontSize:10,color:"rgba(255,255,255,0.25)"}}>{pts}pts · {rider.sessions?.length??0} ses.</span>
                          </div>
                        </div>
                        {a!==null&&<span style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:24,fontWeight:900,color:scoreColor(a)}}>{a.toFixed(1)}</span>}
                        <button onClick={e=>{e.stopPropagation();deleteRider(rider.id);}} style={{background:"rgba(255,23,68,0.1)",border:"1px solid rgba(255,23,68,0.3)",borderRadius:6,color:"#FF1744",fontSize:12,fontWeight:700,padding:"4px 8px",flexShrink:0,cursor:"pointer"}} title="Eliminar rider">✕</button>
                        <span style={{color:"rgba(255,255,255,0.2)",fontSize:16}}>›</span>
                      </div>
                    );
                  })}
                </div>
              );
            })}
            {adminTab===1&&(
              <div>
                {/* Add bonus form */}
                <div style={{background:"rgba(0,0,0,0.35)",borderRadius:12,padding:"20px",marginBottom:20,border:"1px solid rgba(255,215,0,0.15)"}}>
                  <div style={{fontSize:11,color:"#FFD700",textTransform:"uppercase",letterSpacing:"0.15em",marginBottom:14,fontWeight:700}}>⭐ Añadir Puntos Extra</div>
                  <div style={{marginBottom:12}}>
                    <div style={{fontSize:10,color:"rgba(255,255,255,0.35)",textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:5}}>Rider</div>
                    <select value={bonusRider} onChange={e=>setBonusRider(e.target.value)}>
                      <option value="">— Selecciona un rider —</option>
                      {GROUPS.map(g=>(
                        <optgroup key={g.id} label={g.name}>
                          {riders.filter(r=>r.groupId===g.id).map(r=>(
                            <option key={r.id} value={r.id}>{r.name} ({riderPoints(r)} pts actuales)</option>
                          ))}
                        </optgroup>
                      ))}
                    </select>
                  </div>
                  <div style={{display:"grid",gridTemplateColumns:"1fr 2fr",gap:10,marginBottom:14}}>
                    <div>
                      <div style={{fontSize:10,color:"rgba(255,255,255,0.35)",textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:5}}>Puntos</div>
                      <input type="number" value={bonusPts} onChange={e=>setBonusPts(e.target.value)} placeholder="Ej: 100" style={{textAlign:"center",fontFamily:"'Barlow Condensed',sans-serif",fontSize:22,fontWeight:900,color:"#FFD700"}}/>
                    </div>
                    <div>
                      <div style={{fontSize:10,color:"rgba(255,255,255,0.35)",textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:5}}>Motivo (opcional)</div>
                      <input value={bonusReason} onChange={e=>setBonusReason(e.target.value)} placeholder="Ej: Actitud en clase, reto superado..."/>
                    </div>
                  </div>
                  {/* Quick amount buttons */}
                  <div style={{display:"flex",gap:6,marginBottom:14,flexWrap:"wrap"}}>
                    {[25,50,100,150,200,500].map(n=>(
                      <button key={n} onClick={()=>setBonusPts(String(n))}
                        style={{padding:"6px 14px",borderRadius:20,border:`1px solid ${bonusPts===String(n)?"#FFD700":"rgba(255,215,0,0.2)"}`,background:bonusPts===String(n)?"rgba(255,215,0,0.15)":"transparent",color:bonusPts===String(n)?"#FFD700":"rgba(255,255,255,0.4)",fontSize:12,fontWeight:700,transition:"all 0.15s"}}>
                        +{n}
                      </button>
                    ))}
                  </div>
                  <button onClick={addBonus} disabled={!bonusRider||!bonusPts}
                    style={{width:"100%",padding:"12px",background:bonusSaved?"#00A857":(!bonusRider||!bonusPts)?"rgba(255,255,255,0.05)":"linear-gradient(90deg,#FFD700,#FFA000)",border:"none",borderRadius:8,color:bonusSaved||(!bonusRider||!bonusPts)?"rgba(255,255,255,0.4)":"#000",fontSize:14,fontWeight:800,textTransform:"uppercase",letterSpacing:"0.05em",transition:"all 0.3s",cursor:(!bonusRider||!bonusPts)?"not-allowed":"pointer"}}>
                    {bonusSaved?"✓ Puntos Añadidos":(!bonusRider||!bonusPts)?"Selecciona rider y puntos":"⭐ Sumar Puntos"}
                  </button>
                </div>

                {/* History of bonus points per rider */}
                <div style={{fontSize:11,color:"rgba(255,255,255,0.35)",textTransform:"uppercase",letterSpacing:"0.12em",marginBottom:12}}>Historial de puntos extra</div>
                {riders.filter(r=>(r.bonusPoints||[]).length>0).length===0&&(
                  <div style={{textAlign:"center",padding:"24px",color:"rgba(255,255,255,0.2)",fontSize:13}}>Aún no hay puntos extra registrados</div>
                )}
                {riders.filter(r=>(r.bonusPoints||[]).length>0).map(rider=>{
                  const g=GROUPS.find(gr=>gr.id===rider.groupId);
                  const total=(rider.bonusPoints||[]).reduce((s,b)=>s+b.pts,0);
                  return (
                    <div key={rider.id} style={{background:"rgba(0,0,0,0.3)",borderRadius:10,padding:"14px",marginBottom:10,border:`1px solid ${g.color}15`}}>
                      <div style={{display:"flex",alignItems:"center",gap:10,marginBottom:10}}>
                        <div style={{width:32,height:32,borderRadius:"50%",background:`${g.color}20`,border:`1.5px solid ${g.color}40`,display:"flex",alignItems:"center",justifyContent:"center",fontSize:13,fontWeight:900,color:g.color,fontFamily:"'Barlow Condensed',sans-serif",flexShrink:0}}>{rider.name[0]}</div>
                        <div style={{flex:1}}><div style={{fontSize:14,fontWeight:700}}>{rider.name}</div><div style={{fontSize:11,color:g.color}}>{g.name}</div></div>
                        <div style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:20,fontWeight:900,color:"#FFD700"}}>+{total} pts</div>
                      </div>
                      {[...(rider.bonusPoints||[])].reverse().map(b=>(
                        <div key={b.id} style={{display:"flex",alignItems:"center",gap:8,padding:"7px 0",borderTop:"1px solid rgba(255,255,255,0.04)"}}>
                          <span style={{fontFamily:"'Barlow Condensed',sans-serif",fontSize:18,fontWeight:900,color:"#FFD700",minWidth:48}}>+{b.pts}</span>
                          <div style={{flex:1,minWidth:0}}>
                            <div style={{fontSize:12,fontWeight:600,overflow:"hidden",textOverflow:"ellipsis",whiteSpace:"nowrap"}}>{b.reason}</div>
                            <div style={{fontSize:10,color:"rgba(255,255,255,0.25)"}}>{b.date}</div>
                          </div>
                          <button onClick={()=>removeBonus(rider.id,b.id)} style={{background:"transparent",border:"none",color:"rgba(255,68,68,0.5)",fontSize:16,padding:"0 4px",lineHeight:1,flexShrink:0}} title="Eliminar">×</button>
                        </div>
                      ))}
                    </div>
                  );
                })}
              </div>
            )}
            {adminTab===2&&(
              <div>
                <div style={{marginBottom:12}}><div style={{fontSize:10,color:"rgba(255,255,255,0.35)",textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:5}}>Nombre</div><input value={newName} onChange={e=>setNewName(e.target.value)} placeholder="Nombre del rider"/></div>
                <div style={{marginBottom:12}}><div style={{fontSize:10,color:"rgba(255,255,255,0.35)",textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:5}}>Año de nacimiento</div><select value={newBirthYear} onChange={e=>setNewBirthYear(e.target.value)}><option value="">— Seleccionar —</option>{Array.from({length:40},(_,i)=>new Date().getFullYear()-2-i).map(y=><option key={y} value={y}>{y} ({new Date().getFullYear()-y} años)</option>)}</select></div>
                <div style={{marginBottom:22}}><div style={{fontSize:10,color:"rgba(255,255,255,0.35)",textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:5}}>Grupo</div><select value={newGroup} onChange={e=>setNewGroup(e.target.value)}>{GROUPS.map(g=><option key={g.id} value={g.id}>{g.name} ({g.age} años)</option>)}</select></div>
                <button onClick={addRider} style={{width:"100%",padding:"13px",background:saved?"#00A857":"linear-gradient(90deg,#CC0000,#990000)",border:"none",borderRadius:8,color:"#fff",fontSize:14,fontWeight:800,textTransform:"uppercase",transition:"background 0.3s"}}>{saved?"✓ Rider Añadido":"Añadir Rider"}</button>
              </div>
            )}
          </div>
        )}
      </div>
    </div>
  );
}


ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
